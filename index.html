<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projet Jeu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d0b12;
        overflow: hidden;
      }
      /*
        ⚠️ **Plus de `image-rendering: pixelated` ici** (11 aout 2026).

        Cette ligne ne servait a rien sur un ecran a 100 % — le canvas y fait
        exactement sa taille — et elle abimait tout le reste. Sur un ecran a
        150 ou 200 % (le cas de la machine de developpement), le navigateur
        agrandit le canvas entier, et `pixelated` lui fait faire cet
        agrandissement au **plus proche voisin** : chaque lettre de l'interface
        sortait en escalier.

        Le pixel-art, lui, ne perd rien : ce qui garde les sprites nets, c'est
        `pixelArt: true` dans la configuration Phaser (filtrage des textures
        **dans** le canvas, donc au zoom de la camera). Cette ligne-ci ne
        concernait que le dernier agrandissement, celui du navigateur.
      */
      canvas {
        display: block;
        /*
          `!important` parce que **Phaser pose ce style lui-meme, en ligne**, au
          moment ou il cree le renderer (`pixelArt: true` appelle
          `CanvasInterpolation.setCrisp`). Une regle de feuille de style marquee
          important passe devant un style en ligne qui ne l'est pas : c'est la
          seule facon de le reprendre sans toucher au moteur.
        */
        image-rendering: auto !important;
      }
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
