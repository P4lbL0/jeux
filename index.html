<!doctype html>
<html lang="fr">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projet Jeu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;

        overflow: hidden;

        display: grid;
        place-items: center;
      }

  </head>

    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
